networks:
  default:
    external: true
    name: ${NETWORK_NAME:-sano-net}

services:
  # 正式环境常驻实例：查询始终开放，server-mode=all时启用T+1同步。
  es-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ES_SERVER_IMAGE:-lxw13000/sano-es-server}:${ES_SERVER_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-sano-es-server}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    cpus: "2.0"
    mem_limit: 2g
    mem_reservation: 1g
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-8002}
      LOG_DIR: /app/logs/es-server
      SANO_SERVER_MODE: ${SANO_SERVER_MODE:-all}
      SANO_ES_IMPORT_T_PLUS_ONE_ENABLED: ${SANO_ES_IMPORT_T_PLUS_ONE_ENABLED:-true}
      # 版本A尚未实现延迟轮询，正式环境必须显式关闭。
      SANO_ES_POLLING_ENABLED: "false"

      # Java运行参数。正式服务器还有其他服务时，限制导入服务资源占用。
      JAVA_OPTS: "-Xms1g -Xmx1536m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/es-server"

      # MySQL配置。生产部署建议通过环境变量覆盖默认值。
      MYSQL_UNM: ${MYSQL_UNM:-admin}
      MYSQL_PWD: ${MYSQL_PWD:-fl#alHGaldsj!skgnn2850allgnJsHg}

      # ES配置。容器间通过共享Docker网络访问ES内部端口。
      ES_URIS: ${ES_URIS:-elasticsearch8:9200}
      ES_USERNAME: ${ES_USERNAME:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-es2peter}
    ports:
      # 发布到宿主机全部网络接口；Nginx在本机仍通过127.0.0.1:8002访问。
      - "${SERVER_PORT:-8002}:${SERVER_PORT:-8002}"
    volumes:
      - ./logs:/app/logs/es-server

  # 更新期间临时承接查询。使用当前稳定镜像，query模式从代码层禁止创建同步线程。
  es-server-query:
    profiles: ["query-handoff"]
    image: ${QUERY_ES_SERVER_IMAGE:-lxw13000/sano-es-server:latest}
    container_name: ${QUERY_CONTAINER_NAME:-sano-es-server-query}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${QUERY_PORT:-8003}
      LOG_DIR: /app/logs/es-server-query
      SANO_SERVER_MODE: query
      SANO_ES_IMPORT_T_PLUS_ONE_ENABLED: "false"
      SANO_ES_POLLING_ENABLED: "false"
      JAVA_OPTS: "-Xms512m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      MYSQL_UNM: ${MYSQL_UNM:-admin}
      MYSQL_PWD: ${MYSQL_PWD:-fl#alHGaldsj!skgnn2850allgnJsHg}
      ES_URIS: ${ES_URIS:-elasticsearch8:9200}
      ES_USERNAME: ${ES_USERNAME:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-es2peter}
    ports:
      - "${QUERY_PORT:-8003}:${QUERY_PORT:-8003}"
    volumes:
      - ./logs-query:/app/logs/es-server-query
