logging:
  config: classpath:logback-spring.xml
  file:
    path: ${LOG_DIR:logs}
  level:
    root: INFO
    com.tsd.sano.es: DEBUG
    com.tsd.sano.es.importer: DEBUG
    org.springframework: INFO
    org.springframework.jdbc.core: INFO
    co.elastic.clients: INFO
    org.elasticsearch.client: WARN
    io.lettuce.core: INFO
    com.zaxxer.hikari: INFO

sano:
  # all与query都开放查询；query只关闭T+1和未来polling同步能力。
  server-mode: ${SANO_SERVER_MODE:all}
  log:
    # 开发环境保留周期短，便于本地排查时快速滚动。
    max-file-size: 50MB
    max-history: 7
    total-size-cap: 2GB
    async-queue-size: 2048
  es:
    #    uris: ${ES_URIS:127.0.0.1:9201}
    uris: ${ES_URIS:es-test.fofunlive.net}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:es2peter}
    socket-timeout: 600000
    connection-timeout: 500000
    connection-request-timeout: 5000
    max-conn-total: 100
    max-conn-per-route: 20

  notify:
    # 同步任务通知总开关，测试环境默认关闭，避免调试误发。
    enabled: ${SANO_NOTIFY_ENABLED:true}
    # 飞书/Lark机器人配置；关闭或webhook地址为空时跳过该通道。
    lark:
      # 飞书/Lark机器人开关。
      enabled: ${LARK_NOTIFY_ENABLED:true}
      # 飞书/Lark机器人webhook地址。
      webhook-url: ${LARK_WEBHOOK_URL:https://open.larksuite.com/open-apis/bot/v2/hook/c1af0ddb-8ba5-4dae-a0e2-ecc476bcc5fd}
      # 机器人签名密钥；未启用签名时留空。
      secret: ${LARK_WEBHOOK_SECRET:6MKCorKya6KxX99qxqaKwh}
  import:
    # T+1与未来polling共用的写入资源和安全排空参数。
    common:
      # 部署drain等待Reader、队列、Bulk和任务终态安全收敛的最长秒数。
      drain-timeout-seconds: ${SANO_ES_SYNC_DRAIN_TIMEOUT_SECONDS:600}
      write:
        # 所有同步引擎合计允许的在途ES Bulk请求数。
        global-bulk-concurrency: ${SANO_ES_SYNC_GLOBAL_BULK_CONCURRENCY:3}
        # polling有等待请求时为其保留的Bulk并发数。
        polling-reserved-concurrency: ${SANO_ES_SYNC_POLLING_RESERVED_CONCURRENCY:2}
        # polling空闲时T+1最多可使用的Bulk并发数。
        t-plus-one-max-concurrency: ${SANO_ES_SYNC_T_PLUS_ONE_MAX_CONCURRENCY:3}
        # 所有同步引擎排队、在途和重试批次的合计内存预算。
        global-queue-max-bytes: ${SANO_ES_SYNC_GLOBAL_QUEUE_MAX_BYTES:128MB}

    t-plus-one:
      # 测试主实例默认开启T+1；临时query实例由Compose覆盖为false。
      enabled: ${SANO_ES_IMPORT_T_PLUS_ONE_ENABLED:true}
      # 每天02:30导入昨天的数据
      cron: "0 30 2 * * ?"
      # 每轮调度最大运行分钟数；到期后不再启动下一条待执行任务。
      max-run-minutes: 5
      # 每轮调度最多拉取100条待执行任务，覆盖多表和少量历史积压场景
      task-fetch-limit: 100
      # 每批读取数据库数量
      read-batch-size: 5000
      # Bulk线程数
      worker-count: 4
      # BlockingQueue 队列缓存容量
      queue-capacity: 10
      # 每次Bulk文档数
      bulk-actions: 3000
      # 或每次bulk累计5MB立即发送，单位MB
      bulk-size-mb: 5
      # 最大重试次数
      retry-times: 3
      # Retry等待(ms)
      retry-interval: 1000
      # 失败文档数超过该值时不绑定alias
      max-failed-documents: 1000
      # 失败率超过该值时不绑定alias，0.001 = 0.1%
      max-failure-rate: 0.001
      # 是否开启T+1导入监控
      enable-monitor: true
      # T+1建索引导入期间是否关闭Refresh
      disable-refresh: true
      # T+1建索引导入期间是否关闭副本
      disable-replica: true

    polling:
      # Polling总开关；主循环实现并完成验证前保持关闭。
      enabled: ${SANO_ES_POLLING_ENABLED:false}
      # 当前实例允许同时持有并运行的Polling表数量。
      max-active-tables: ${SANO_ES_POLLING_MAX_ACTIVE_TABLES:5}
      # 当前日期查询为空后再次轮询MySQL的等待时间。
      poll-interval: ${SANO_ES_POLLING_POLL_INTERVAL:5s}
      # 次日零点后继续等待旧日期晚到数据的时间。
      date-close-delay: ${SANO_ES_POLLING_DATE_CLOSE_DELAY:10m}
      # 每次按日期和递增ID读取MySQL的最大记录数。
      read-batch-size: ${SANO_ES_POLLING_READ_BATCH_SIZE:3000}
      # ES整批Bulk失败后的重试次数，不包含首次请求。
      bulk-retry-times: ${SANO_ES_POLLING_BULK_RETRY_TIMES:2}
      # 每次整批Bulk重试前的固定等待时间。
      bulk-retry-interval: ${SANO_ES_POLLING_BULK_RETRY_INTERVAL:1s}

    # T+1与polling共用同一表目录；enabled=false时两种引擎都忽略该表。
    # table-name是同步表唯一标识；index-alias为空时默认等于table-name，仅作为业务查询Alias。
    # sync-mode未配置时默认t-plus-one；polling首次启动还必须配置bootstrap-start-date。
    # reconcile未配置时默认true；同步流程统一异步调用，对账入口按单表配置决定是否实际执行。
    # id-column用于MySQL游标和ES文档ID；dt-column/dt-column-type/where-sql决定日期查询条件。
    # delete-history-index和reserve-days控制成功导入后的历史索引清理。
    tables:
      - enabled: true
        index-alias: sano_wallet_coin_record
        table-name: sano_wallet_coin_record
        mapping-file: sano_wallet_coin_record.json
        # 版本A全部保持T+1，polling引擎完成前不得改为polling。
        sync-mode: t-plus-one
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 30
        id-column: id
        dt-column: dt
        # dt字段类型；DATE按dt = importDate查询。
        dt-column-type: DATE
        # where-sql为空时自动使用 dt = importDate
        where-sql:
      - enabled: true
        index-alias: sano_wallet_diamond_record
        table-name: sano_wallet_diamond_record
        mapping-file: sano_wallet_diamond_record.json
        sync-mode: t-plus-one
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 30
        id-column: id
        dt-column: dt
        # dt字段类型；DATE按dt = importDate查询。
        dt-column-type: DATE
        # where-sql为空时自动使用 dt = importDate
        where-sql:
      - enabled: true
        index-alias: sano_wallet_lucky_diamond_record_10m
        table-name: sano_wallet_lucky_diamond_record_10m
        mapping-file: sano_wallet_lucky_diamond_record_10m.json
        sync-mode: t-plus-one
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 30
        id-column: id
        dt-column: dt
        # dt字段类型；DATE按dt = importDate查询。
        dt-column-type: DATE
        # where-sql为空时自动使用 dt = importDate
        where-sql:
      - enabled: true
        index-alias: sano_game_record
        table-name: sano_game_record
        mapping-file: sano_game_record.json
        sync-mode: t-plus-one
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 30
        id-column: id
        # 源表没有DATE分区字段，使用创建时间按天读取。
        dt-column: create_time
        # DATETIME/TIMESTAMP字段按当天左闭右开时间范围查询。
        dt-column-type: DATETIME
        # where-sql为空时自动按create_time的当天时间范围查询。
        where-sql:
