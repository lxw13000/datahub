          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://database-1-instance-1-ap-southeast-1b.cbiiioywwvwg.ap-southeast-1.rds.amazonaws.com:3306/sano-prod?useUnicode=true&characterEncoding=UTF8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Chongqing&allowPublicKeyRetrieval=true
    username: ${MYSQL_UNM:admin}
    password: ${MYSQL_PWD:fl#alHGaldsj!skgnn2850allgnJsHg}
    hikari:
      # 导入任务串行读取MySQL，生产限制连接池规模，避免误触发并发任务占用过多数据库连接。
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 300000

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${LOG_DIR:/app/logs/es-server}
  level:
    root: INFO
    com.tsd.sano.es: INFO
    com.tsd.sano.es.modules.tplusone: INFO
    # 正式环境输出Polling五分钟汇总和关键事件；逐批耗时保留为DEBUG供临时排查。
    com.tsd.sano.es.modules.polling: INFO
    org.springframework: INFO
    org.springframework.jdbc.core: INFO
    co.elastic.clients: WARN
    org.elasticsearch.client: WARN
    io.lettuce.core: WARN
    com.zaxxer.hikari: INFO

sano:
  # all与query都开放查询；query只关闭T+1和未来polling同步能力。
  server-mode: ${SANO_SERVER_MODE:all}
  log:
    # 生产环境保留周期较长，便于追踪历史同步问题。
    max-file-size: 100MB
    max-history: 30
    total-size-cap: 10GB
    async-queue-size: 8192
  es:
    # 宿主机直接运行时访问正式ES的9201端口；Docker部署由Compose覆盖为elasticsearch8:9200。
    uris: ${ES_URIS:127.0.0.1:9201}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:es2peter}
    socket-timeout: 600000
    connection-timeout: 500000
    connection-request-timeout: 5000
    max-conn-total: 100
    max-conn-per-route: 20

  notify:
    # 同步任务通知总开关，生产环境建议通过环境变量显式开启。
    enabled: ${SANO_NOTIFY_ENABLED:true}
    # 飞书/Lark机器人配置；关闭或webhook地址为空时跳过该通道。
    lark:
      # 飞书/Lark机器人开关。
      enabled: ${LARK_NOTIFY_ENABLED:true}
      # 飞书/Lark机器人webhook地址。
      webhook-url: ${LARK_WEBHOOK_URL:https://open.larksuite.com/open-apis/bot/v2/hook/b99cf729-136e-40e6-90b7-0ec5e8c61ebb}
      # 机器人签名密钥；未启用签名时留空。
      secret: ${LARK_WEBHOOK_SECRET:WJ83ViVAM6RbDUjuxhvtah}
  import:
    # T+1、polling及未来MQ共用的写入资源和安全排空参数。
    common:
      # 部署drain等待Reader、队列、Bulk和任务终态安全收敛的最长秒数。
      drain-timeout-seconds: ${SANO_ES_SYNC_DRAIN_TIMEOUT_SECONDS:600}
      # 所有同步引擎合计允许的在途ES Bulk请求数。
      global-bulk-concurrency: ${SANO_ES_SYNC_GLOBAL_BULK_CONCURRENCY:5}
      # polling有等待请求时为其保留的Bulk并发数。
      polling-reserved-concurrency: ${SANO_ES_SYNC_POLLING_RESERVED_CONCURRENCY:2}
      # polling空闲时T+1最多可使用的Bulk并发数。
      t-plus-one-max-concurrency: ${SANO_ES_SYNC_T_PLUS_ONE_MAX_CONCURRENCY:3}

    t-plus-one:
      # 正式主实例默认开启T+1；临时query实例由Compose覆盖为false。
      enabled: ${SANO_ES_IMPORT_T_PLUS_ONE_ENABLED:true}
      # 每天03:00导入昨天的数据。
      cron: "0 30 1 * * ?"
      # 每轮调度最大运行分钟数；到期后不再启动下一条待执行任务。
      max-run-minutes: 480
      # 每轮查询任务索引时最多拉取的待执行任务数。
      task-fetch-limit: 100
      # Reader每批从MySQL读取的数据量。
      read-batch-size: 15000
      # 并行消费Reader队列的Bulk Worker数量。
      worker-count: 4
      # Reader到Bulk之间的批次队列容量；每个元素是一批read-batch-size数据。
      queue-capacity: 16
      # T+1排队、在途和重试批次的合计内存预算。
      queue-max-bytes: ${SANO_ES_SYNC_T_PLUS_ONE_QUEUE_MAX_BYTES:128MB}
      # 单次ES Bulk请求的最大文档数。
      bulk-actions: 3000
      # 单次ES Bulk请求的目标大小上限，单位MB。
      bulk-size-mb: 8
      # Bulk请求级异常的最大重试次数，不包含首次请求。
      retry-times: 3
      # Bulk重试等待时间，单位毫秒。
      retry-interval: 1000
      # 失败文档数超过该值时不切换Alias。
      max-failed-documents: 1000
      # 失败率超过该值时不切换Alias，0.001表示0.1%。
      max-failure-rate: 0.001
      # T+1批量写入期间是否临时关闭索引自动Refresh。
      disable-refresh: true
      # T+1批量写入期间是否临时将索引副本数调整为0。
      disable-replica: true

    polling:
      # 正式环境默认启用Polling；需要临时停用时可通过环境变量覆盖。
      enabled: ${SANO_ES_POLLING_ENABLED:false}
      # 当前实例允许同时持有并运行的Polling表数量。
      max-active-tables: ${SANO_ES_POLLING_MAX_ACTIVE_TABLES:5}
      # 当前日期查询为空后再次轮询MySQL的等待时间。
      poll-interval: ${SANO_ES_POLLING_POLL_INTERVAL:5s}
      # 次日零点后继续等待旧日期晚到数据的时间。
      date-close-delay: ${SANO_ES_POLLING_DATE_CLOSE_DELAY:10m}
      # 每次按日期和递增ID读取MySQL的最大记录数。
      read-batch-size: ${SANO_ES_POLLING_READ_BATCH_SIZE:3000}
      # ES整批Bulk失败后的重试次数，不包含首次请求。
      bulk-retry-times: ${SANO_ES_POLLING_BULK_RETRY_TIMES:2}
      # 每次整批Bulk重试前的固定等待时间。
      bulk-retry-interval: ${SANO_ES_POLLING_BULK_RETRY_INTERVAL:1s}

    # T+1与polling共用同一表目录；enabled=false时两种引擎都忽略该表。
    # table-name是同步表唯一标识；index-alias为空时默认等于table-name，仅作为业务查询Alias。
    # sync-mode未配置时默认t-plus-one；polling首次启动还必须配置bootstrap-start-date。
    # reconcile未配置时默认true；同步流程统一异步调用，对账入口按单表配置决定是否实际执行。
    # id-column用于MySQL游标和ES文档ID；dt-column/dt-column-type/where-sql决定日期查询条件。
    # delete-history-index和reserve-days控制成功导入后的历史索引清理。
    tables:
      - enabled: true
        index-alias: sano_wallet_coin_record
        table-name: sano_wallet_coin_record
        mapping-file: sano_wallet_coin_record.json
        # 使用延迟轮询同步；首次没有checkpoint时从指定业务日期开始。
        sync-mode: t_plus_one
        bootstrap-start-date: 2026-07-29
        # 开启对账；对账入口按单表配置决定是否实际执行。
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 60
        id-column: id
        dt-column: dt
        # dt字段类型；DATE按dt = importDate查询。
        dt-column-type: DATE
        # where-sql为空时自动使用 dt = importDate
        where-sql:
      - enabled: true
        index-alias: sano_wallet_diamond_record
        table-name: sano_wallet_diamond_record
        mapping-file: sano_wallet_diamond_record.json
        sync-mode: t-plus-one
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 60
        id-column: id
        dt-column: dt
        # dt字段类型；DATE按dt = importDate查询。
        dt-column-type: DATE
        # where-sql为空时自动使用 dt = importDate
        where-sql:
      - enabled: true
        index-alias: sano_wallet_lucky_diamond_record_10m
        table-name: sano_wallet_lucky_diamond_record_10m
        mapping-file: sano_wallet_lucky_diamond_record_10m.json
        sync-mode: t-plus-one
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 60
        id-column: id
        dt-column: dt
        # dt字段类型；DATE按dt = importDate查询。
        dt-column-type: DATE
        # where-sql为空时自动使用 dt = importDate
        where-sql:
      - enabled: true
        index-alias: sano_game_record
        table-name: sano_game_record
        mapping-file: sano_game_record.json
        sync-mode: t-plus-one
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 60
        id-column: id
        # 源表没有DATE分区字段，使用创建时间按天读取。
        dt-column: create_time
        # DATETIME/TIMESTAMP字段按当天左闭右开时间范围查询。
        dt-column-type: DATETIME
        # where-sql为空时自动按create_time的当天时间范围查询。
        where-sql:
