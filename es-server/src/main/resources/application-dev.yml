spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://47.128.144.26:3306/sano?useUnicode=true&characterEncoding=UTF8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Chongqing&allowPublicKeyRetrieval=true
    username: ${MYSQL_UNM:root}
    password: ${MYSQL_PWD:SADFH28!asoaignljASjacoOs}
    hikari:
      # 导入任务串行读取MySQL，限制连接池规模，避免误触发并发任务占用过多数据库连接。
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 300000

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${LOG_DIR:logs}
  level:
    root: INFO
    com.tsd.sano.es: DEBUG
    com.tsd.sano.es.importer: DEBUG
    org.springframework: INFO
    org.springframework.jdbc.core: INFO
    co.elastic.clients: INFO
    org.elasticsearch.client: WARN
    io.lettuce.core: INFO
    com.zaxxer.hikari: INFO

sano:
  log:
    # 开发环境保留周期短，便于本地排查时快速滚动。
    max-file-size: 50MB
    max-history: 7
    total-size-cap: 2GB
    async-queue-size: 2048
  es:
#    uris: ${ES_URIS:127.0.0.1:9201}
    uris: ${ES_URIS:tools-es.fofunlive.net}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:es2peter}
    socket-timeout: 600000
    connection-timeout: 500000
    connection-request-timeout: 5000
    max-conn-total: 100
    max-conn-per-route: 20

    import:
      # 默认关闭；确认ES和数据库配置无误后再打开
      task-enabled: true
      # 每天02:30导入昨天的数据
      cron: "0 49 20 * * ?"
      # 每轮调度最多运行480分钟，超时后不再启动下一条待执行任务
      max-run-minutes: 5
      # 每轮调度最多拉取100条待执行任务，覆盖多表和少量历史积压场景
      task-fetch-limit: 100
      # 每批读取数据库数量
      read-batch-size: 8000
      # Bulk线程数
      worker-count: 4
      # BlockingQueue 队列缓存容量
      queue-capacity: 30
      # 每次Bulk文档数
      bulk-actions: 5000
      # 或每次bulk累计8MB立即发送，单位MB
      bulk-size-mb: 10
      # 最大重试次数
      retry-times: 3
      # Retry等待(ms)
      retry-interval: 1000
      # 失败文档数超过该值时不绑定alias
      max-failed-documents: 1000
      # 失败率超过该值时不绑定alias，0.001 = 0.1%
      max-failure-rate: 0.001
      # 是否开启导入监控
      enable-monitor: true

      # 单机Docker ES建议保持0副本
      # 导入期间是否关闭Refresh
      disable-refresh: true
      # 导入期间是否关闭副本
      disable-replica: true

      tables:
        - enabled: true
          index-alias: sano_wallet_coin_record
          table-name: sano_wallet_coin_record
          mapping-file: sano_wallet_coin_record.json
          # 导入完成是否删除该表历史索引
          delete-history-index: true
          # 该表历史索引保留天数
          reserve-days: 4
          id-column: id
          dt-column: dt
          # where-sql为空时自动使用 dt = importDate
          where-sql:
        - enabled: true
          index-alias: sano_wallet_diamond_record
          table-name: sano_wallet_diamond_record
          mapping-file: sano_wallet_diamond_record.json
          # 导入完成是否删除该表历史索引
          delete-history-index: true
          # 该表历史索引保留天数
          reserve-days: 3
          id-column: id
          dt-column: dt
          # where-sql为空时自动使用 dt = importDate
          where-sql:
        - enabled: true
          index-alias: sano_wallet_lucky_diamond_record_10m
          table-name: sano_wallet_lucky_diamond_record_10m
          mapping-file: sano_wallet_lucky_diamond_record_10m.json
          # 导入完成是否删除该表历史索引
          delete-history-index: true
          # 该表历史索引保留天数
          reserve-days: 3
          id-column: id
          dt-column: dt
          # where-sql为空时自动使用 dt = importDate
          where-sql:
