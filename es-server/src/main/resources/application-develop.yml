spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://database-1-instance-1-ap-southeast-1b.cbiiioywwvwg.ap-southeast-1.rds.amazonaws.com:3306/sano-prod?useUnicode=true&characterEncoding=UTF8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Chongqing&allowPublicKeyRetrieval=true
    username: ${MYSQL_UNM:admin}
    password: ${MYSQL_PWD:fl#alHGaldsj!skgnn2850allgnJsHg}
    hikari:
      # 导入任务串行读取MySQL，限制连接池规模，避免误触发并发任务占用过多数据库连接。
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 300000

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${LOG_DIR:logs}
  level:
    root: INFO
    com.tsd.sano.es: DEBUG
    com.tsd.sano.es.modules.tplusone: DEBUG
    org.springframework: INFO
    org.springframework.jdbc.core: INFO
    co.elastic.clients: INFO
    org.elasticsearch.client: WARN
    io.lettuce.core: INFO
    com.zaxxer.hikari: INFO

sano:
  # all提供查询并启用同步；query同样提供查询，但关闭所有同步任务和流水线。
  server-mode: query
  log:
    # 开发环境保留周期短，便于本地排查时快速滚动。
    max-file-size: 50MB
    max-history: 7
    total-size-cap: 2GB
    async-queue-size: 2048
  es:
    uris: ${ES_URIS:es.fofunlive.net}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:es2peter}
    socket-timeout: 600000
    connection-timeout: 500000
    connection-request-timeout: 5000
    max-conn-total: 100
    max-conn-per-route: 20

  notify:
    # 同步任务通知总开关，开发环境默认关闭，避免本地调试误发。
    enabled: ${SANO_NOTIFY_ENABLED:false}
    # 飞书/Lark机器人配置；关闭或webhook地址为空时跳过该通道。
    lark:
      # 飞书/Lark机器人开关。
      enabled: ${LARK_NOTIFY_ENABLED:false}
      # 飞书/Lark机器人webhook地址。
      webhook-url: ${LARK_WEBHOOK_URL:https://open.larksuite.com/open-apis/bot/v2/hook/c1af0ddb-8ba5-4dae-a0e2-ecc476bcc5fd}
      # 机器人签名密钥；未启用签名时留空。
      secret: ${LARK_WEBHOOK_SECRET:6MKCorKya6KxX99qxqaKwh}
  import:
    # T+1写入资源和安全排空参数。
    common:
      # 部署drain等待Reader、队列、Bulk和任务终态安全收敛的最长秒数。
      drain-timeout-seconds: ${SANO_ES_SYNC_DRAIN_TIMEOUT_SECONDS:600}
      # 当前实例允许的在途ES Bulk请求总数。
      global-bulk-concurrency: ${SANO_ES_SYNC_GLOBAL_BULK_CONCURRENCY:3}
      # T+1最多可使用的Bulk并发数。
      t-plus-one-max-concurrency: ${SANO_ES_SYNC_T_PLUS_ONE_MAX_CONCURRENCY:3}

    t-plus-one:
      # T+1同步总开关；关闭后定时任务、手工导入和后台流水线均不执行。
      enabled: false
      # 每天02:30导入昨天的数据。
      cron: "0 24 17 * * ?"
      # 每轮调度最大运行分钟数；到期后不再启动下一条待执行任务。
      max-run-minutes: 5
      # 每轮查询任务索引时最多拉取的待执行任务数。
      task-fetch-limit: 100
      # Reader每批从MySQL读取的数据量。
      read-batch-size: 5000
      # 并行消费Reader队列的Bulk Worker数量。
      worker-count: 4
      # Reader到Bulk之间的批次队列容量。
      queue-capacity: 10
      # T+1排队、在途和重试批次的合计内存预算。
      queue-max-bytes: ${SANO_ES_SYNC_T_PLUS_ONE_QUEUE_MAX_BYTES:128MB}
      # 单次ES Bulk请求的最大文档数。
      bulk-actions: 3000
      # 单次ES Bulk请求的目标大小上限，单位MB。
      bulk-size-mb: 5
      # Bulk请求级异常的最大重试次数，不包含首次请求。
      retry-times: 3
      # Bulk重试等待时间，单位毫秒。
      retry-interval: 1000
      # 失败文档数超过该值时不切换Alias。
      max-failed-documents: 1000
      # 失败率超过该值时不切换Alias，0.001表示0.1%。
      max-failure-rate: 0.001
      # T+1批量写入期间是否临时关闭索引自动Refresh。
      disable-refresh: true
      # T+1批量写入期间是否临时将索引副本数调整为0。
      disable-replica: true

    # T+1表目录；enabled=false时不生成和执行该表任务。
    # table-name是同步表唯一标识；index-alias为空时默认等于table-name，仅作为业务查询Alias。
    # reconcile未配置时默认true；同步流程统一异步调用，对账入口按单表配置决定是否实际执行。
    # index-mode支持DAY/MONTH/YEAR/SINGLE；未配置默认DAY，SINGLE必须配置fixed-index-name。
    # id-column用于MySQL游标；document-id-columns为空时也作为ES文档ID。
    # 程序按dt-column/dt-column-type生成每日条件，支持DATE/DATETIME/INTEGER_DATE。
    # 仅DAY、delete-history-index=true、reserve-days>0同时满足时自动清理；其他情况永久保留。
    tables:
      - enabled: false
        # 现有表保持按日索引，导入成功后才绑定Alias。
        index-mode: DAY
        index-alias: sano_wallet_coin_record
        table-name: sano_wallet_coin_record
        mapping-file: sano_wallet_coin_record.json
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 30
        id-column: id
        dt-column: dt
        # dt字段类型；DATE按dt = importDate查询。
        dt-column-type: DATE
      - enabled: false
        # 现有表保持按日索引，导入成功后才绑定Alias。
        index-mode: DAY
        index-alias: sano_wallet_diamond_record
        table-name: sano_wallet_diamond_record
        mapping-file: sano_wallet_diamond_record.json
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 30
        id-column: id
        dt-column: dt
        # dt字段类型；DATE按dt = importDate查询。
        dt-column-type: DATE
      - enabled: false
        # 现有表保持按日索引，导入成功后才绑定Alias。
        index-mode: DAY
        index-alias: sano_wallet_diamond_freeze_record
        table-name: sano_wallet_diamond_freeze_record
        mapping-file: sano_wallet_diamond_freeze_record.json
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 30
        id-column: id
        # 源表没有DATE字段，按创建时间的当天左闭右开范围读取。
        dt-column: create_time
        dt-column-type: DATETIME
      - enabled: false
        # 现有表保持按日索引，导入成功后才绑定Alias。
        index-mode: DAY
        index-alias: sano_wallet_lucky_diamond_record_10m
        table-name: sano_wallet_lucky_diamond_record_10m
        mapping-file: sano_wallet_lucky_diamond_record_10m.json
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 30
        id-column: id
        dt-column: dt
        # dt字段类型；DATE按dt = importDate查询。
        dt-column-type: DATE
      - enabled: false
        # 现有表保持按日索引，导入成功后才绑定Alias。
        index-mode: DAY
        index-alias: sano_game_record
        table-name: sano_game_record
        mapping-file: sano_game_record.json
        reconcile: true
        # 导入完成是否删除该表历史索引
        delete-history-index: true
        # 该表历史索引保留天数
        reserve-days: 30
        id-column: id
        # 源表没有DATE分区字段，使用创建时间按天读取。
        dt-column: create_time
        # DATETIME/TIMESTAMP字段按当天左闭右开时间范围查询。
        dt-column-type: DATETIME
      - enabled: false
        # 充值订单使用固定索引永久保存；首次需人工全量初始化，成功后才执行每日增量。
        index-mode: SINGLE
        fixed-index-name: sano_wallet_recharge_v1
        index-alias: sano_wallet_recharge
        table-name: sano_wallet_recharge
        mapping-file: sano_wallet_recharge.json
        # SINGLE按全表现状对账；当天尚未同步的新增订单可能产生数量差异。
        reconcile: true
        # 固定索引不自动清理，不配置reserve-days。
        delete-history-index: false
        # 订单号同时用作MySQL分页游标和ES文档ID。
        id-column: order_no
        # 按下单时间当天左闭右开范围读取；历史订单变更由人工重跑创建日期或全量重建。
        dt-column: create_time
        dt-column-type: DATETIME
      - enabled: false
        # 主播日数据每天读取昨日，写入所属月索引；创建时即绑定Alias。
        index-mode: MONTH
        index-alias: sano_anchor_data
        table-name: sano_anchor_data
        mapping-file: sano_anchor_data.json
        # ES文档ID按顺序以“_”拼接；未配置或集合为空时使用id-column。
        # 同一主播不同日期必须使用不同文档ID，避免月索引内相互覆盖。
        document-id-columns:
          - live_day
          - user_id
        # 按live_day对账当日数量、最小和最大user_id，而不是整个月的数据。
        reconcile: true
        # 月索引永久保留，不自动删除。
        delete-history-index: false
        # 单日内user_id唯一，用于MySQL递增分页和续跑断点。
        id-column: user_id
        dt-column: live_day
        # yyyyMMdd整数日期，直接使用整数等值条件，不对MySQL字段使用转换函数。
        dt-column-type: INTEGER_DATE
      - enabled: false
        # 代理旗下主播日数据按月保存；同一主播同一天可能归属不同代理。
        index-mode: MONTH
        index-alias: sano_proxy_anchor_data
        table-name: sano_proxy_anchor_data
        mapping-file: sano_proxy_anchor_data.json
        # ES文档ID按配置顺序以“_”拼接，整日重放时覆盖同一业务记录。
        document-id-columns:
          - proxy_id
          - anchor_user_id
          - live_day
        # 按live_day对账当日数量及最小/最大anchor_user_id。
        reconcile: true
        # 月索引永久保存，不自动清理。
        delete-history-index: false
        # 每日数据较少，整日一次读取后沿用Bulk分批写入；未完成时重放全天。
        # 未配置read-mode的表默认CURSOR；SINGLE人工Bootstrap始终使用游标分页。
        read-mode: FULL_DAY
        # 本表不按此字段分页，仅用于对账；ES文档ID由上述三个字段组成。
        id-column: anchor_user_id
        dt-column: live_day
        # yyyyMMdd整数日期，例如20261015。
        dt-column-type: INTEGER_DATE
      - enabled: false
        # 用户日消费数据每天读取昨日，写入所属月索引；创建时即绑定Alias。
        index-mode: MONTH
        index-alias: sano_user_data
        table-name: sano_user_data
        mapping-file: sano_user_data.json
        # ES文档ID按顺序以“_”拼接，区分同一用户同一天的消费类型和道具。
        document-id-columns:
          - user_id
          - live_day
          - type
          - prop_id
        # 按live_day对账当日数量及最小/最大user_id。
        reconcile: true
        # 月索引永久保存，不自动删除。
        delete-history-index: false
        # 整日一次读取，ES仍按Bulk配置分批写入；未完成时重放全天。
        read-mode: FULL_DAY
        # user_id在单日内可能重复，本表不按其分页，仅用于对账。
        id-column: user_id
        dt-column: live_day
        # yyyyMMdd整数日期，直接使用等值条件，不对MySQL字段使用函数。
        dt-column-type: INTEGER_DATE
      - enabled: false
        # 活跃用户日数据每天读取昨日，写入所属月索引；创建时即绑定Alias。
        index-mode: MONTH
        index-alias: sano_user_active
        table-name: sano_user_active
        mapping-file: sano_user_active.json
        # 三个DECIMAL充值字段沿用scaled_float/100；金额按两位小数缩放，不改变源单位。
        # 该映射不覆盖DECIMAL(20,2)全部极值；单值乘100须处于有符号long范围内。
        # ES文档ID按顺序以“_”拼接，同一用户不同日期互不覆盖。
        document-id-columns:
          - user_id
          - day_int
        # 按day_int对账当日数量及最小/最大user_id。
        reconcile: true
        # 月索引永久保存，不自动删除。
        delete-history-index: false
        # 整日一次读取，ES仍按Bulk配置分批写入；未完成时重放全天。
        read-mode: FULL_DAY
        # 整日模式不按该字段分页，user_id用于对账统计。
        id-column: user_id
        dt-column: day_int
        # yyyyMMdd整数日期，例如20261015。
        dt-column-type: INTEGER_DATE
