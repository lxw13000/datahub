networks:
  default:
    external: true
    name: ${NETWORK_NAME:-sano-net}

services:
  # 测试环境常驻实例：查询始终开放，server-mode=all时额外启用T+1同步。
  es-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ES_SERVER_IMAGE:-lxw13000/sano-es-server}:${ES_SERVER_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-sano-es-server-test}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    cpus: "2.0"
    mem_limit: 2g
    mem_reservation: 1g
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: test
      SERVER_PORT: ${SERVER_PORT:-9003}
      LOG_DIR: /app/logs/es-server
      SANO_SERVER_MODE: ${SANO_SERVER_MODE:-all}
      SANO_ES_IMPORT_T_PLUS_ONE_ENABLED: ${SANO_ES_IMPORT_T_PLUS_ONE_ENABLED:-true}
      SANO_ES_POLLING_ENABLED: "false"
      JAVA_OPTS: "-Xms1g -Xmx1536m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/es-server"
      MYSQL_UNM: ${MYSQL_UNM:-root}
      MYSQL_PWD: ${MYSQL_PWD:-SADFH28!asoaignljASjacoOs}
      ES_URIS: ${ES_URIS:-elasticsearch8-test:9200}
      ES_USERNAME: ${ES_USERNAME:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-es2peter}
    ports:
      # 容器端口只供同机Nginx和部署脚本访问；外部业务走测试域名，内部业务走Nginx的9103端口。
      - "127.0.0.1:${SERVER_PORT:-9003}:${SERVER_PORT:-9003}"
    volumes:
      - ./logs-test:/app/logs/es-server

  # 安全更新期间临时承接查询；同一镜像以query模式运行，所有同步入口均被运行时门禁关闭。
  es-server-query:
    profiles: ["query-handoff"]
    image: ${QUERY_ES_SERVER_IMAGE:-lxw13000/sano-es-server:latest}
    container_name: ${QUERY_CONTAINER_NAME:-sano-es-server-test-query}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: test
      SERVER_PORT: ${QUERY_PORT:-9004}
      LOG_DIR: /app/logs/es-server-query
      SANO_SERVER_MODE: query
      SANO_ES_IMPORT_T_PLUS_ONE_ENABLED: "false"
      SANO_ES_POLLING_ENABLED: "false"
      JAVA_OPTS: "-Xms512m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      MYSQL_UNM: ${MYSQL_UNM:-root}
      MYSQL_PWD: ${MYSQL_PWD:-SADFH28!asoaignljASjacoOs}
      ES_URIS: ${ES_URIS:-elasticsearch8-test:9200}
      ES_USERNAME: ${ES_USERNAME:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-es2peter}
    ports:
      - "127.0.0.1:${QUERY_PORT:-9004}:${QUERY_PORT:-9004}"
    volumes:
      - ./logs-test-query:/app/logs/es-server-query
